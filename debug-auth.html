<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debugger</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            padding: 20px;
        }

        .log {
            border: 1px solid #444;
            padding: 10px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            background: #000;
        }

        .btn {
            padding: 8px 16px;
            cursor: pointer;
            background: #0070f3;
            color: white;
            border: none;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <h1>Hub Data Debugger</h1>
    <button class="btn" onclick="runCheck()">Run Read Diagnostics</button>
    <button class="btn" style="background:#e00;" onclick="runWriteCheck()">Run WRITE/SAVE Test</button>
    <div id="output"></div>

    <script>
        const logBox = document.getElementById('output');
        const log = (msg) => logBox.innerHTML += `<div>${msg}</div>`;
        const logSection = (title) => logBox.innerHTML += `<div style="color:#0f0; margin-top:20px; font-weight:bold">=== ${title} ===</div>`;

        async function runWriteCheck() {
            if (!confirm('This will try to save your current data back to the server. Continue?')) return;
            logSection('Checking API WRITE (POST)');
            log('Fetching current data first...');

            try {
                // 1. Get Data
                const res = await fetch('/api/user-data?username=moe&t=' + Date.now());
                if (!res.ok) throw new Error('Read failed: ' + res.status);
                const data = await res.json();
                log(`Current Items: ${data.length}`);

                // 2. Post Same Data Back (Loopback Test)
                log('Attempting to SAVE data back (Write Test)...');
                const saveRes = await fetch('/api/user-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'moe', calculations: data })
                });

                const saveText = await saveRes.text();
                log(`Save Status: ${saveRes.status}`);
                log(`Response: ${saveText}`);

                if (saveRes.ok) {
                    log('✅ WRITE SUCCESSFUL. The server accepted the save.');
                } else {
                    log('❌ WRITE FAILED. The server rejected the save.');
                }

            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }
        }

        async function runCheck() {
            logBox.innerHTML = 'Starting...';

            // 1. Check Read
            logSection('Checking API READ (GET)');
            try {
                const res = await fetch('/api/user-data?username=moe');
                const source = res.headers.get('X-Data-Source');
                const tokenStatus = res.headers.get('X-Token-Status'); // NEW
                const status = res.status;
                const text = await res.text();

                log(`Status: ${status}`);
                log(`Source Header: ${source || 'MISSING'}`);
                log(`Token Status: ${tokenStatus || 'MISSING'}`);

                if (tokenStatus === 'Missing') {
                    log('❌ CRITICAL: The server explicitly reports the Token is MISSING.');
                    log('   (Did you redeploy after adding it?)');
                } else if (tokenStatus === 'Present') {
                    log('✅ The server sees the Token.');
                }

                if (source === 'local') {
                    log('⚠️ WARNING: Serving from BACKUP (Read-Only). GitHub Token likely invalid or file missing.');
                } else if (source === 'cloud') {
                    log('✅ SUCCESS: Serving from CLOUD (GitHub).');
                } else {
                    log('❓ UNKNOWN Source.');
                }

                log(`Data Length: ${text.length} chars`);

            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }

            // 2. Check Write (Dry Run attempt)
            logSection('Checking API WRITE (POST)');
            log('Skipping actual write to prevent data corruption, but we can infer permissions from the Read test.');
            log('If Read is LOCAL, Write will definitely FAIL.');
        }
    </script>
</body>

</html>
