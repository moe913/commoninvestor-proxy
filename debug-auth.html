<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debugger</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            padding: 20px;
        }

        .log {
            border: 1px solid #444;
            padding: 10px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            background: #000;
        }

        .btn {
            padding: 8px 16px;
            cursor: pointer;
            background: #0070f3;
            color: white;
            border: none;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <h1>Hub Data Debugger</h1>
    <button class="btn" onclick="runCheck()">Run Diagnostics</button>
    <div id="output"></div>

    <script>
        const logBox = document.getElementById('output');
        const log = (msg) => logBox.innerHTML += `<div>${msg}</div>`;
        const logSection = (title) => logBox.innerHTML += `<div style="color:#0f0; margin-top:20px; font-weight:bold">=== ${title} ===</div>`;

        async function runCheck() {
            logBox.innerHTML = 'Starting...';

            // 1. Check Read
            logSection('Checking API READ (GET)');
            try {
                const res = await fetch('/api/user-data?username=moe');
                const source = res.headers.get('X-Data-Source');
                const status = res.status;
                const text = await res.text();

                log(`Status: ${status}`);
                log(`Source Header: ${source || 'MISSING'}`);

                if (source === 'local') {
                    log('⚠️ WARNING: Serving from BACKUP (Read-Only). GitHub Token likely invalid or file missing.');
                } else if (source === 'cloud') {
                    log('✅ SUCCESS: Serving from CLOUD (GitHub).');
                } else {
                    log('❓ UNKNOWN Source.');
                }

                log(`Data Length: ${text.length} chars`);

            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }

            // 2. Check Write (Dry Run attempt)
            logSection('Checking API WRITE (POST)');
            log('Skipping actual write to prevent data corruption, but we can infer permissions from the Read test.');
            log('If Read is LOCAL, Write will definitely FAIL.');
        }
    </script>
</body>

</html>
