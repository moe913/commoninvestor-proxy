<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Token Status</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a1a;
            color: #fff;
        }

        pre {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        button {
            padding: 10px 20px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0051a2;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        .success {
            background: #10B981;
            color: white;
        }

        .error {
            background: #EF4444;
            color: white;
        }
    </style>
</head>

<body>
    <h1>Token Diagnostics</h1>
    <p>Click below to check if the server can see your <code>GITHUB_TOKEN</code>.</p>
    <button onclick="checkStatus()">Check Server Status</button>

    <div id="result"></div>

    <script>
        async function checkStatus() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Checking...';
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                let html = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

                if (!data.hasToken) {
                    html += '<div class="status error">❌ <b>MISSING TOKEN</b>: The server cannot see <code>GITHUB_TOKEN</code>. <br>If running locally: Ensure you have a <code>.env</code> file or have run <code>vercel env pull</code>.</div>';
                } else if (data.githubAuthValidation !== 200) {
                    html += '<div class="status error">❌ <b>INVALID TOKEN</b>: The token exists but GitHub rejected it (Status ' + data.githubAuthValidation + '). Check scopes or expiration.</div>';
                } else {
                    html += '<div class="status success">✅ <b>TOKEN OK</b>: Server has a valid token for user <b>' + data.githubUser + '</b>.</div>';
                }

                resultDiv.innerHTML = html;
            } catch (e) {
                resultDiv.innerHTML = '<div class="status error">Request Failed: ' + e.message + '</div>';
            }
        }
    </script>
</body>

</html>
